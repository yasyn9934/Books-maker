<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e09">
<title>صانع الكتب</title>
<link rel="stylesheet" href="app.css">
<script src="app-config.js"></script>
<script>window.ROYAL_IN_APP=true</script>
<script src="royal-theme.js"></script>
</head>
<body>
<div id="appRoot">
  <header id="topbar">
    <button id="avatarBtn" class="avatar-btn" aria-label="حسابي"><span id="avatarInner">👤</span></button>
    <button id="backBtn" class="back-btn" aria-label="رجوع" hidden><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="tb-title" id="tbTitle">الرئيسية</div>
    <button id="syncBtn" class="sync-btn" aria-label="مزامنة" title="مزامنة">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.9-3M4 5v4h4"/><path d="M4 13a8 8 0 0014.9 3M20 19v-4h-4"/></svg><i id="syncDot" hidden></i>
    </button>
    <button id="bellBtn" class="bell-btn" aria-label="الإشعارات">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>
      <span id="bellBadge" hidden>0</span>
    </button>
  </header>

  <main id="frames"></main>

  <nav id="tabbar">
    <button class="tab active" data-slot="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>الرئيسية</span></button>
    <button class="tab" data-slot="editor"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span>المحرر</span><i class="dot" id="editDot" hidden></i></button>
    <button class="tab" data-slot="shares"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>المشاركات</span></button>
    <button class="tab" data-slot="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>الإعدادات</span></button>
    <button class="tab" data-slot="updates"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 19h16"/></svg><span>التحديث</span><i class="dot" id="updDot" hidden></i></button>
    <button class="tab" data-slot="admin" id="adminTab" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span>الإدارة</span></button>
  </nav>
</div>

<div id="toastHost"></div>
<script src="app-files.js"></script>
<script src="app.js"></script>
</body>
</html>
