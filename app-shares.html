<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح الروابط</title>
<script src="royal-theme.js"></script>
<script src="app-bridge.js"></script>
<style>
@font-face{font-family:'Amiri';src:url('fonts/Amiri-Regular.ttf')}
@font-face{font-family:'Aref Ruqaa';src:url('fonts/ArefRuqaa-Bold.ttf');font-weight:700}
:root{--gold:#c9a227;--green:#7fa855;--bg:#0d0c09;--text:#ede8d5;--card:#181510;--surf2:#21200f;--gold-line:rgba(var(--rt-rgb,201,162,39),.3);--dim:#a89b7c;--muted:#6b5f48}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:'Amiri',serif;padding:18px;min-height:100vh}
h1{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:24px;text-align:center;margin:6px 0 4px}
.sub{color:var(--dim);text-align:center;margin-bottom:18px;font-size:15px}
.box{background:var(--card);border:1px solid var(--gold-line);border-radius:18px;padding:14px;margin-bottom:16px}
.row{display:flex;gap:8px}input{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--gold-line);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;direction:ltr;text-align:left}
button{background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:0 18px;font:700 16px 'Amiri',serif;cursor:pointer}
h2{font-size:17px;color:var(--green);margin:4px 0 10px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:var(--surf2);border:1px solid transparent;border-radius:14px;padding:11px 12px;margin-bottom:8px;color:var(--text);cursor:pointer;font:inherit}
.item small{display:block;color:var(--muted);font-size:12px}.err{color:#e07a73;font-size:14px;margin-top:8px;min-height:18px}
.empty{color:var(--muted);text-align:center;padding:14px}
</style></head><body>
<h1>🔗 فتح الروابط</h1>
<p class="sub">الصق أي رابط من هذا الموقع (كتاب مشارَك، منشور، حساب، تعليقات…) ليُفتح في مكانه الصحيح</p>
<div class="box">
  <div class="row"><input id="lnk" placeholder="الصق رابط الموقع هنا" autocomplete="off"><button id="go">فتح</button></div>
  <div class="err" id="err"></div>
</div>
<div class="box"><h2>🕘 فُتح مؤخراً</h2><div id="recent"></div></div>
<script>
// كل روابط هذا الموقع (حصراً): مشاركات، منشورات، حسابات، تعليقات، الصفحة الرئيسية… تُوجَّه للتبويب المناسب
function siteBases(){
  const b=[];
  try{const c=window.parent.ROYAL_APP_CONFIG;if(c&&c.SITE_BASE)b.push(new URL(c.SITE_BASE).href.replace(/\/?$/,'/'))}catch(e){}
  b.push('https://yasyn9934.github.io/Books-maker/');
  try{b.push(new URL('.',window.parent.location.href).href)}catch(e){}
  b.push('https://appassets.androidplatform.net/site/');
  return [...new Set(b)];
}
function parse(v){
  v=(v||'').trim(); if(!v) return {error:'الصق رابطاً أولاً.'};
  let u=null; try{u=new URL(v)}catch(e){}
  if(u){
    for(const base of siteBases()){
      if(u.href===base.replace(/\/$/,'')||u.href===base) return {rel:'index.html'};
      if(u.href.startsWith(base)) return check(u.href.slice(base.length));
    }
    return {error:'هذا الرابط لا يتبع هذا الموقع. يمكن فتح روابط الموقع فقط.'};
  }
  if(/^[\w-]{6,}$/.test(v)) return {rel:'s/index.html?id='+encodeURIComponent(v)};      // معرّف مشاركة مجرّد
  if(/^(s\/|[\w-]+\.html)/.test(v)) return check(v);                                      // مسار نسبي داخل الموقع
  return {error:'لم أتعرّف على هذا الرابط. الصق رابطاً كاملاً من الموقع.'};
}
function check(rel){
  const path=rel.split(/[?#]/)[0];
  if(path==='editor.html') return {error:'لا يمكن فتح المحرر برابط؛ افتح الكتاب من الرئيسية.'};
  if(path===''||path==='/') rel='index.html'+rel;
  return {rel};
}
document.getElementById('go').onclick=()=>{
  const r=parse(document.getElementById('lnk').value);
  if(r.error){document.getElementById('err').textContent=r.error;return}
  document.getElementById('err').textContent='';
  royalNavigate(r.rel);
};
document.getElementById('lnk').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
let rec=[];try{rec=JSON.parse(localStorage.getItem('royal_app_recent_shares')||'[]')}catch(e){}
const box=document.getElementById('recent');
if(!rec.length) box.innerHTML='<div class="empty">لا توجد مشاركات مفتوحة بعد</div>';
rec.forEach(r=>{const b=document.createElement('button');b.className='item';
  const t=document.createElement('div');t.textContent=r.title||'كتاب مشارَك';
  const s=document.createElement('small');s.textContent=new Date(r.time).toLocaleDateString('ar');t.appendChild(s);
  b.innerHTML='<span>📖</span>';b.appendChild(t);b.onclick=()=>royalNavigate(r.url);box.appendChild(b);});
</script></body></html>
